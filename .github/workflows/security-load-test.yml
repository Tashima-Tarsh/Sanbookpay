name: Security & Load Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Secret & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run secret scan
        run: node scripts/scan-secrets.js

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Validate JavaScript runtime
        run: npm run build

  load-test:
    name: k6 Load Test (UPI Mirror)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Payment API (in-process) and wait for health
        run: |
          mkdir -p output/testing
          export NODE_ENV=test
          export SQLITE_DB_PATH="$RUNNER_TEMP/loadtest.sqlite"
          export ENCRYPTION_MASTER_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          export JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
          export INITIAL_ADMIN_EMAIL=admin@loadtest.example
          export INITIAL_ADMIN_PASSWORD=$(node -e "console.log(require('crypto').randomBytes(24).toString('hex'))")
          node scripts/serve-for-load.js > output/testing/api.log 2>&1 &
          API_PID=$!
          READY=0
          # Wait for the server's own "listening" marker first (avoids TCP/IP quirks)
          for i in $(seq 1 90); do
            if grep -q "listening on" output/testing/api.log 2>/dev/null; then
              echo "Server listening (marker after $i attempts)"
              READY=1
              break
            fi
            sleep 2
          done
          # Confirm over HTTP too
          if [ "$READY" = "1" ]; then
            for i in $(seq 1 15); do
              if curl -sf http://localhost:6100/health > /dev/null 2>&1; then
                echo "API health OK"
                READY=2
                break
              fi
              sleep 2
            done
          fi
          if [ "$READY" != "2" ]; then
            echo "API failed to become healthy (READY=$READY)"
            echo "===== API LOG ====="
            cat output/testing/api.log
            echo "===== LISTENING SOCKETS ====="
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E '6100|State' || true
            exit 1
          fi
          echo "API_PID=$API_PID"

      - name: Upload API startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-startup-log
          path: output/testing/api.log

      - name: Install k6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg2 ca-certificates curl
          sudo install -d /usr/share/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq k6

      - name: Run k6 load test (Stage 1)
        run: |
          BASE_URL=http://localhost:6100 \
          MERCHANT_ID=$(node -e "console.log(require('crypto').randomUUID())") \
          DEVICE_ID=$(node -e "console.log('dev_' + require('crypto').randomUUID())") \
          k6 run scripts/load-test-upi-mirror.js

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: output/testing/load-test-summary.json
