name: Build Dynamo Bridge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-bridge/gradlew

      - name: Build Debug APK
        working-directory: apps/android-bridge
        run: ./gradlew assembleDebug

      - name: Generate SHA256 checksum
        run: |
          sha256sum apps/android-bridge/app/build/outputs/apk/debug/app-debug.apk > apps/android-bridge/app/build/outputs/apk/debug/app-debug.apk.sha256
          echo "APK_SHA256=$(sha256sum apps/android-bridge/app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dynamo-bridge-${{ github.run_number }}
          name: Dynamo Bridge v${{ github.run_number }}
          body: |
            Dynamo Bridge Android APK (debug build)

            ## Download
            - APK: app-debug.apk
            - SHA256: ${{ env.APK_SHA256 }}

            ## Install
            1. Download the APK below.
            2. Enable "Install from unknown sources" in Android Settings.
            3. Open the APK to install.
            4. Grant Notification Listener permission when prompted.

            ## Security
            - APK is signed with a debug key.
            - Verify SHA256 checksum before installing.
            - TLS-only network config in release builds.
          files: |
            apps/android-bridge/app/build/outputs/apk/debug/app-debug.apk
            apps/android-bridge/app/build/outputs/apk/debug/app-debug.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
