# ============================================================
# DYNAMO PAY UNIVERSAL UPI MIRROR — Docker Compose
# Profiles: local-dev, pilot, production, high-scale
# ============================================================

services:
  # ============================================================
  # PostgreSQL — Durable transaction system (mandatory)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    profiles:
      - local-dev
      - pilot
      - production
      - high-scale
    environment:
      POSTGRES_DB: dynamopay
      POSTGRES_USER: dynamopay
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/src/migrations:/docker-entrypoint-initdb.d:ro
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dynamopay -d dynamopay"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ============================================================
  # Redis — Cache and fast lookup (NOT sole durable record)
  # ============================================================
  redis:
    image: redis:7-alpine
    profiles:
      - local-dev
      - pilot
      - production
      - high-scale
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================
  # Payment API — UPI Mirror backend (stateless replicas)
  # ============================================================
  payment-api:
    build:
      context: .
      dockerfile: Dockerfile.payment-api
    profiles:
      - local-dev
      - pilot
      - production
      - high-scale
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      YOUPI_BIND_HOST: 0.0.0.0
      DATABASE_URL: postgresql://dynamopay:${DB_PASSWORD}@postgres:5432/dynamopay
      REDIS_URL: redis://redis:6379
      WEBHOOK_MAX_RETRIES: 5
      BASE_CHECKOUT_URL: ${BASE_CHECKOUT_URL:-https://checkout.example.com}
      BASE_PAYMENT_API_URL: https://api.example.com
      ENCRYPTION_MASTER_KEY_FILE: /run/secrets/encryption_key
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - db_password
      - encryption_key
      - jwt_secret
    ports:
      - "6100:6100"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6100/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: ${PAYMENT_API_REPLICAS:-2}
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ============================================================
  # Webhook Worker — Concurrent callback dispatch
  # ============================================================
  webhook-worker:
    build:
      context: .
      dockerfile: Dockerfile.payment-api
    command: ["node", "scripts/webhook-worker.js"]
    profiles:
      - pilot
      - production
      - high-scale
    depends_on:
      payment-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dynamopay:${DB_PASSWORD}@postgres:5432/dynamopay
      REDIS_URL: redis://redis:6379
      WEBHOOK_MAX_RETRIES: 5
      ENCRYPTION_MASTER_KEY_FILE: /run/secrets/encryption_key
    secrets:
      - db_password
      - encryption_key
    deploy:
      replicas: ${WEBHOOK_WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 1G

  # ============================================================
  # Super Admin — Management dashboard (port 9000)
  # ============================================================
  super-admin:
    build:
      context: .
      dockerfile: Dockerfile.payment-api
    command: ["node", "apps/super-admin/src/index.js"]
    profiles:
      - pilot
      - production
      - high-scale
    depends_on:
      payment-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PAYMENT_API_URL: http://payment-api:6100
      ENCRYPTION_MASTER_KEY_FILE: /run/secrets/encryption_key
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - encryption_key
      - jwt_secret
    ports:
      - "9000:9000"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G

  # ============================================================
  # Reverse Proxy — Caddy with TLS termination
  # ============================================================
  caddy:
    image: caddy:2-alpine
    profiles:
      - production
      - high-scale
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      payment-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================
  # Backup — PostgreSQL backup jobs
  # ============================================================
  backup:
    image: postgres:16-alpine
    profiles:
      - production
      - high-scale
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - backup_data:/backups
    secrets:
      - db_password
    command: ["sh", "-c", "while true; do /backup.sh; sleep 3600; done"]
    deploy:
      resources:
        limits:
          memory: 256M

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backup_data:

# ============================================================
# Secrets
# ============================================================
secrets:
  db_password:
    file: ./secrets/db_password.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
